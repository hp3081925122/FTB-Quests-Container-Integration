plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
    implementation("dev.ftb.mods:ftb-library-neoforge:${project.ftb_library_version}") {
        transitive = false
    }
    implementation("dev.ftb.mods:ftb-quests-neoforge:${project.ftb_quests_version}") {
        transitive = false
    }
    implementation("dev.ftb.mods:ftb-teams-neoforge:${project.ftb_teams_version}") {
        transitive = false
    }

    implementation "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    implementation "curse.maven:sophisticated-core-618298:9578162"
    implementation "curse.maven:sophisticated-backpacks-422301:9524812"
    implementation "curse.maven:refined-storage-243076:8211701"
    implementation "curse.maven:applied-energistics-2-223794:9519988"
    runtimeOnly "curse.maven:guideme-1173950:9366366"
    compileOnly "curse.maven:beyond-dimensions-1222890:9380015"

    implementation "curse.maven:jei-238222:8792638"
    implementation "curse.maven:just-enough-characters-250702:8117474"
    implementation "curse.maven:jade-324717:8591319"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    def utf8Props = new Properties()
    file('gradle.properties').withReader('UTF-8') { reader ->
        utf8Props.load(reader)
    }
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            ftb_quests_version_range: project.ftb_quests_version_range,
            mod_id: project.mod_id,
            mod_name: utf8Props.getProperty('mod_name', project.mod_name),
            mod_license: utf8Props.getProperty('mod_license', project.mod_license),
            mod_version: project.mod_version,
            mod_authors: utf8Props.getProperty('mod_authors', project.mod_authors),
            mod_description: utf8Props.getProperty('mod_description', project.mod_description)
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
